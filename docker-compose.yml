version: "3.9"

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: chunqiu
      POSTGRES_PASSWORD: chunqiu
      POSTGRES_DB: chunqiu
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chunqiu"]
      interval: 5s
      timeout: 5s
      retries: 10

  deps:
    build:
      context: .
      dockerfile: docker/dev.Dockerfile
    working_dir: /app
    command: sh -c "pnpm install"
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
      - pnpm_store:/pnpm

  server:
    build:
      context: .
      dockerfile: docker/dev.Dockerfile
    working_dir: /app
    command: >-
      sh -c "
        pnpm --filter @chunqiu/server exec prisma generate --schema /app/packages/db/prisma/schema.prisma &&
        pnpm --filter @chunqiu/server exec prisma db push --schema /app/packages/db/prisma/schema.prisma &&
        pnpm --filter @chunqiu/server dev
      "
    environment:
      DATABASE_URL: postgresql://chunqiu:chunqiu@db:5432/chunqiu?schema=public
      PORT: "5004"
      WS_PORT: "5005"
    ports:
      - "5004:5004"
    depends_on:
      db:
        condition: service_healthy
      deps:
        condition: service_completed_successfully
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
      - pnpm_store:/pnpm

  ws:
    build:
      context: .
      dockerfile: docker/dev.Dockerfile
    working_dir: /app
    command: >-
      sh -c "
        pnpm --filter @chunqiu/server exec prisma generate --schema /app/packages/db/prisma/schema.prisma &&
        pnpm --filter @chunqiu/server ws:start
      "
    environment:
      DATABASE_URL: postgresql://chunqiu:chunqiu@db:5432/chunqiu?schema=public
      WS_PORT: "5005"
    ports:
      - "5005:5005"
    depends_on:
      db:
        condition: service_healthy
      deps:
        condition: service_completed_successfully
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
      - pnpm_store:/pnpm

volumes:
  db_data:
  node_modules:
  pnpm_store:
